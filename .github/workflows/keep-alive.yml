name: NEXUS Keep-Alive

on:
  push:
    branches: [main]
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -s https://nex-event.onrender.com > /dev/null
          echo "Nodal link established at $(date)"
